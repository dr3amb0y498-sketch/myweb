<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 90vh;
      margin: 0;
      padding: 15px;
    }
    .profile-card {
      background: #1e293b;
      padding: 25px;
      border-radius: 16px;
      text-align: center;
      max-width: 320px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    .profile-card img {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #38bdf8;
    }
    h1 {
      margin: 15px 0 5px;
      font-size: 22px;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="profile-card">
    <img src="photo.png" alt="My Photo">
    <h1>Welcome to My Website</h1>
    <p>Ye website maine apne phone par Termux se banayi hai!</p>
    <a href="https://www.instagram.com/hariom__thakur91" target="_blank" style="display: inline-block; padding: 10px 22px; background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: white; text-decoration: none; border-radius: 25px; font-weight: bold; margin-top: 15px; font-size: 14px;">Follow on Instagram</a>
    
  </div>

</body>
</html>
